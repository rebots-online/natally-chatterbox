<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Natally voice comparison</title>
<h1>Natally voice comparison</h1>
<p>This exercises the application's real speech service without chat or sign-in.</p>
<p>Uses the application's configured youthful voice, pitch and synthesis speed. This is a technical playback check, not a listening approval gate.</p>
<label>Speaker <select id="voice"><option>F1</option><option>F2</option><option>F3</option><option>F4</option><option>F5</option></select></label>
<p><label>Resource use <select id="resource"><option value="auto">Auto</option><option value="gentle">Gentle</option></select></label>
<label>Tone <select id="tone"><option value="soft">Soft</option><option value="natural">Natural</option><option value="warm">Warm</option></select></label>
<label><input type="checkbox" id="natural"> Original pitch and speed</label></p>
<p><label>Sample <textarea id="sample" rows="4" cols="55"></textarea></label></p>
<button id="speak">Speak test sentence</button>
<button id="stop">Stop speech</button>
<p id="status" role="status"></p>
<p id="playback">Not started</p>
<pre id="errors"></pre>
<div id="measurements"></div>
<div id="progress"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { VoiceDownloadStatus } from '/src/components/VoiceDownloadStatus.tsx';
  import { VoiceMeasurementPanel } from '/src/components/VoiceMeasurementPanel.tsx';
  import '/src/index.css';
  import { speakNatallyText, stopSpeaking, DEFAULT_VOICE_SETTINGS, NATALLY_VOICE_SAMPLE } from '/src/services/voiceService.ts';
  import { subscribeVoiceStatus } from '/src/services/chatterboxTts.ts';
  createRoot(document.querySelector('#measurements')).render(React.createElement(VoiceMeasurementPanel));
  createRoot(document.querySelector('#progress')).render(React.createElement(VoiceDownloadStatus));
  document.querySelector('#sample').value = NATALLY_VOICE_SAMPLE;
  document.querySelector('#voice').value = DEFAULT_VOICE_SETTINGS.aiVoiceName;
  subscribeVoiceStatus(status => {
    document.querySelector('#status').textContent = status.message;
    if (status.phase === 'error') document.querySelector('#errors').textContent += status.message + '\n';
  });
  document.querySelector('#speak').onclick = async () => {
    document.querySelector('#playback').textContent = 'Preparing local audio';
    const played = await speakNatallyText(document.querySelector('#sample').value,
      { ...DEFAULT_VOICE_SETTINGS, aiVoiceName: document.querySelector('#voice').value,
        resourceMode: document.querySelector('#resource').value, tone: document.querySelector('#tone').value,
        ...(document.querySelector('#natural').checked ? { pitch: 1, rate: 1 } : {}) },
      () => document.querySelector('#playback').textContent = 'Playing locally generated audio',
      () => document.querySelector('#playback').textContent = 'Playback ended');
    document.querySelector('#playback').textContent = played ? 'Local playback completed successfully' : 'Stopped or failed';
  };
  document.querySelector('#stop').onclick = stopSpeaking;
</script>
</html>
